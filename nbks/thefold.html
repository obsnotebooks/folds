  <script id="4" type="text/markdown" pinned="">
    My understanding. Necessarily limited, historical, dependent on whatever I have been given to think and know, without knowing how or when I recreate these states of thought and knowledge. States? No, these are actions that I am recreating.

    Matter before me. Matter I am and cannot see inside but think and know it enfolds this person reading. Before me is space and many things within it I cannot unfold. My history of reading reminds me that they do. Fold, unfold, refold. They are not points of stuff clagged together in space, composing something solid. They are numberless acts of location and momentum, duration and movement. All together those that interest my body me.

    What is sayable? Consider the memory of a painful feeling. The memory of loss of place. The memory of a child’s pain when they lost you. How can you have this memory now on this surface before you? The surface of a murmurming sea touches here and there what I found sayable. For me it was many enfolded acts of location within my memory. One or two that I found sayable. I set them out. For you it is many enfolded acts of location within your memory, not all of them sayable to me or to anyone. The murmuring surfaces of our seas have touched, here and there, on the flat, and smooth surface I set out.

    Where are these memories stored? No where. How can you store a movement, or an act? Where would you store or feel the folding, unfolding, refolding when numberless points of inflection on the surfaces of our murmuring seas touch? Tell me that this happens on the flat, and smooth surface I set out. Tell me this happens on a surface within me. I cannot believe you. Not for the moment

    I understand the ‘fold’ in Deleuze (reading Leibniz) as part of a better way of thinking and saying both matter and language, fully engaged with contemporary scientific understandings (insofar as I understand these). Rather than conceive matter as spatialized, force-glued composites of atomic points, we may understand objects—things that interest us, including atoms—as inflections—call them folds or potential folds—on or of multidimensional curves of becoming-somethings. If we apply this way of thinking to language then, for example, words are points of inflection which fold, unfold, and refold on syntactic curves within and between language animals. Our animated movement is, of course, rendering all of this a language-world of events and (Bergonsian) memory. This is not the place to expound or elaborate what amounts to an extension of a personal theory of language and its ontology but I hope, nonetheless, to explain how I visualize LLM-generated pseudo-language in these terms. The LLMs represent, by contrast, purely spatialized language, represented, literally, in a static vector space. They are inert and have no time of actual event or becoming. Simplifiying, let’s say that their output is a flat plane of spatialized word-points and speculative, probability-derived syntax. Our reading of this plane may now be visualized as our enfolded curving planes of actual language folded over the flat plane at inflection points of prompt and response and then going on to seek points of tangential contact, where, for example, the flat plane’s word-points (and other linguistic idealities) correspond with matching inflection points on our folding, unfolding and refolding language.
